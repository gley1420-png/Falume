<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6846d7">
  <title>Falumi — Meu jeito de comunicar e aprender</title>
  <style>
    :root { color-scheme: light; --ink:#292345; --purple:#6846d7; --pink:#ff73b9; --yellow:#ffda74; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: linear-gradient(145deg, #ffe8f4 0%, #e8e5ff 55%, #dff8ff 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 25px 18px; }
    main { width: min(100%, 440px); text-align: center; }
    .sparkles { font-size: 2rem; margin: 0 auto 16px; letter-spacing: 7px; }
    .card { background: rgba(255,255,255,.96); border-radius: 32px; box-shadow: 0 18px 50px #5142a32c; padding: 35px 25px 30px; border: 3px solid white; }
    .mascot { width: 98px; height: 98px; border-radius: 29px; margin: 0 auto 20px; display: grid; place-items: center; font-size: 3.2rem; background: linear-gradient(135deg,var(--yellow),#ffd0e8); box-shadow: 0 7px 0 #ffd27f; }
    h1 { font-size: clamp(2rem, 7vw, 2.6rem); margin: 0; letter-spacing: -.06em; color: var(--purple); line-height: 1.17; }
    p { line-height: 1.5; }
    .tagline { font-size: 1.05rem; margin: 15px 0 27px; }
    button { display: block; width: 100%; border: 0; border-radius: 22px; color: white; background: linear-gradient(90deg, #845fea, #ec6aa9); font-size: 1.12rem; font-weight: 750; padding: 17px 18px; box-shadow: 0 7px 0 #b67bd8; cursor: pointer; touch-action: manipulation; }
    button:active { transform: translateY(4px); box-shadow: 0 3px 0 #b67bd8; }
    button:focus-visible { outline: 4px solid #263ac8; outline-offset: 4px; }
    .help { margin: 21px 0 0; min-height: 22px; color: #58516f; font-size: .89rem; }
    footer { font-weight: 700; color: #655d93; margin-top: 20px; font-size: .87rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="sparkles" aria-hidden="true">⭐ 🌈 ⭐</div>
    <section class="card" aria-label="Boas-vindas do Falumi">
      <div class="mascot" aria-hidden="true">💜</div>
      <h1>Oi, eu sou o Falumi!</h1>
      <p class="tagline">Meu jeito de comunicar e aprender.</p>
      <button id="speak" type="button" aria-describedby="status">🔊 Ouvir minha mensagem</button>
      <p class="help" id="status" role="status" aria-live="polite">Toque no botão para ouvir o Falumi.</p>
    </section>
    <footer>Falumi • Primeira tela de teste</footer>
  </main>
  <script>
    (function () {
      const button = document.getElementById('speak');
      const status = document.getElementById('status');
      button.addEventListener('click', function () {
        if (!('speechSynthesis' in window)) {
          status.textContent = 'A voz não está disponível neste navegador.';
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const sentence = new SpeechSynthesisUtterance('Oi, eu sou o Falumi! Meu jeito de comunicar e aprender.');
          sentence.lang = 'pt-BR';
          sentence.rate = 0.88;
          sentence.pitch = 1.08;
          const voices = window.speechSynthesis.getVoices();
          const pt = voices.find(v => /^pt[-_]BR$/i.test(v.lang)) || voices.find(v => /^pt/i.test(v.lang));
          if (pt) sentence.voice = pt;
          sentence.onstart = () => { status.textContent = 'O Falumi está falando!'; };
          sentence.onend = () => { status.textContent = 'Pode ouvir de novo quando quiser.'; };
          sentence.onerror = () => { status.textContent = 'Não foi possível reproduzir a voz. Verifique o som do celular.'; };
          status.textContent = 'Preparando a voz…';
          window.speechSynthesis.speak(sentence);
        } catch (e) {
          status.textContent = 'Não foi possível reproduzir a voz neste navegador.';
        }
      });
    }());
  </script>
</body>
</html>
